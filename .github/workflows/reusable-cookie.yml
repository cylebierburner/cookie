name: Cookie

on:
  pull_request:
  workflow_call:

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lint all
        run: "echo skipped-for-baseline-isolation"

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        runs-on: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]

        include:
          - python-version: pypy-3.11
            runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false


        with:

          cache: 'pip'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install nox
        run: uv tool install nox

      - name: Test pybind11
        run: nox -s 'tests(pybind11, novcs)' -s 'tests(pybind11, vcs, sphinx)'

      - name: Test scikit-build (zensical)
        run: "echo skipped-for-baseline-isolation"

      - name: Test poetry
        run: "echo skipped-for-baseline-isolation"

      - name: Test flit (mkdocs)
        run: "echo skipped-for-baseline-isolation"

      - name: Test uv (zensical)
        run: "echo skipped-for-baseline-isolation"

      - name: Test pdm
        run: "echo skipped-for-baseline-isolation"

      - name: Test maturin
        run: "echo skipped-for-baseline-isolation"

      - name: Test hatch
        run: "echo skipped-for-baseline-isolation"

      - name: Test setuptools PEP 621
        run: "echo skipped-for-baseline-isolation"
          nox -s 'tests(setuptools, novcs, sphinx)' -s 'tests(setuptools, vcs,
          sphinx)'

      - name: Native poetry tooling
        if: matrix.python-version != 'pypy-3.11'
        run: "echo skipped-for-baseline-isolation"
      - name: Native pdm tooling
        run: "echo skipped-for-baseline-isolation"

      - name: Activate MSVC for Meson
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test meson-python
        run: "echo skipped-for-baseline-isolation"

      # No need to check this on each (slow on Windows)
      - name: Compare copier template generation
        if: runner.os == 'Linux' && !startsWith(matrix.python-version, 'pypy')
        run: "echo skipped-for-baseline-isolation"

      - name: Compare cruft template generation
        if: runner.os == 'Linux' && !startsWith(matrix.python-version, 'pypy')
        run: "echo skipped-for-baseline-isolation"

  nox:
    name: Check included Noxfile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false


        with:

          cache: 'pip'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install nox
        run: uv tool install nox

      - name: Test pybind11
        run: "echo skipped-for-baseline-isolation"
      - name: Test scikit-build
        run: "echo skipped-for-baseline-isolation"
      - name: Test poetry
        run: "echo skipped-for-baseline-isolation"
      - name: Test flit
        run: "echo skipped-for-baseline-isolation"
      - name: Test pdm
        run: "echo skipped-for-baseline-isolation"
      - name: Test maturin
        run: "echo skipped-for-baseline-isolation"
      - name: Test hatch
        run: "echo skipped-for-baseline-isolation"
      - name: Test setuptools PEP 621
        run: "echo skipped-for-baseline-isolation"
      - name: Activate MSVC for Meson
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test meson-python
        run: "echo skipped-for-baseline-isolation"
  dist:
    name: Distribution build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build sdist and wheel
        run: "echo skipped-for-baseline-isolation"

      - name: Show results
        run: "echo skipped-for-baseline-isolation"

      - uses: actions/upload-artifact@v7
        with:
          name: Packages
          path: dist

  pass:
    if: always()
    needs: [dist, nox, checks, pre-commit]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
